version: '3.8'

services:
  watcher:
    build: .
    container_name: energy-bill-watcher
    # Reinicia o serviço caso ele caia, mas respeita a parada manual
    restart: unless-stopped
    volumes:
      # Mapeia a pasta local './Contas' do host para a pasta interna '/app/Contas' do container
      - ${WATCH_DIR_HOST:-./Contas}:/app/Contas
      # Mapeia o storage local para que os CSVs e JSONs persistam na máquina
      - ./storage:/app/storage
      # Mapeia os mapeamentos locais para customização em tempo de execução
      - ./data:/app/data
      # Lê variáveis de ambiente a partir do arquivo local .env
      - .env:/app/.env
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - LOCAL_STORAGE=/app/storage
      - WATCH_DIR=/app/Contas

  # Serviço executado sob demanda para rodar o script em lote
  # Uso: docker compose run --rm batch
  batch:
    build: .
    container_name: energy-bill-batch
    volumes:
      - ${WATCH_DIR_HOST:-./Contas}:/app/Contas
      - ./storage:/app/storage
      - ./data:/app/data
      - .env:/app/.env
    command: ["python", "batch_processor.py", "/app/Contas", "/app/storage/batch_results.txt"]
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - LOCAL_STORAGE=/app/storage

  # Serviço executado sob demanda para rodar os testes
  # Uso: docker compose run --rm tests
  tests:
    build: .
    container_name: energy-bill-tests
    volumes:
      - ${WATCH_DIR_HOST:-./Contas}:/app/Contas
      - ./tests:/app/tests
      - ./data:/app/data
      - .env:/app/.env
    command: ["python", "run_test.py"]
