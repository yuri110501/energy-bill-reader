#version: '3.8'

services:
  # Serviço principal: monitora a pasta de entrada em busca de novas faturas
  watcher:
    build: .
    container_name: energy-bill-watcher
    # Reinicia o serviço caso ele caia, mas respeita a parada manual
    restart: unless-stopped
    # Injeta variáveis de ambiente a partir do arquivo .env local (sem montar o arquivo como volume)
    env_file:
      - .env
    volumes:
      # Mapeia a pasta local './Contas' do host para a pasta interna '/app/Contas' do container
      - ${WATCH_DIR:-./Contas}:/app/Contas
      # Mapeia o storage local para que os CSVs e JSONs persistam na máquina host
      - ${LOCAL_STORAGE:-./storage}:/app/storage
      # Mapeia os mapeamentos locais para customização em tempo de execução sem rebuild
      - ./data:/app/data
    environment:
      - LOCAL_STORAGE=/app/storage
      - WATCH_DIR=/app/Contas

  # Serviço executado sob demanda para rodar o script em lote
  # Uso: docker compose run --rm batch
  batch:
    build: .
    container_name: energy-bill-batch
    env_file:
      - .env
    volumes:
      - ${WATCH_DIR:-./Contas}:/app/Contas
      - ${LOCAL_STORAGE:-./storage}:/app/storage
      - ./data:/app/data
    command: ["python", "batch_processor.py", "/app/Contas", "/app/storage/batch_results.txt"]
    environment:
      - LOCAL_STORAGE=/app/storage

  # Serviço executado sob demanda para rodar os testes
  # Uso: docker compose run --rm tests
  tests:
    build: .
    container_name: energy-bill-tests
    volumes:
      - ${WATCH_DIR:-./Contas}:/app/Contas
      - ./tests:/app/tests
      - ./data:/app/data
    command: ["python", "-m", "pytest"]
