[pytest]
# Restringe a busca de testes estritamente a arquivos Python válidos,
# evitando que arquivos de texto de saída (.txt) com prefixo "test_" sejam avaliados.
python_files = test_*.py

# Opções padrão: ignora arquivos quebrados legados e outputs de teste
addopts = --ignore=tests/test_classificacao_regex.py --ignore=tests/test_mes_referencia_out.txt

# Ignora pastas de ambiente virtual, rascunhos e caches para acelerar a inicialização.
norecursedirs = venv .venv .git .pytest_cache scratch tests/scratch
